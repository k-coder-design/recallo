# Recallo: Mobile (D57, W5): on every push to main, builds the phone app and publishes it to GitHub Pages.
# The Mac app is not built here (for it — npm run install:mac / kit:mac on a Mac).
name: Publish Recallo Mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a new one does not cancel one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # No install scripts: the phone does not need Electron or the better-sqlite3 build.
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p tsconfig.mobile.json
      - run: npm run build:mobile
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/mobile

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
